<title>Mi Gym</title>
<style>
:root{
  --bg:#0e0f12;--card:#17191e;--card2:#20232a;--line:#2b2f38;
  --tx:#eef0f3;--mu:#8d95a3;--ac:#c6f432;--acInk:#141a05;
  --ok:#34d399;--okBg:#0f2d22;--okLine:#1f5a43;--warn:#fbbf24;--bad:#f87171;--blue:#60a5fa;
  --acTx:#c6f432;--chart1:#c6f432;--soft:rgba(255,255,255,.08);
  --topBg:rgba(14,15,18,.92);--navBg:rgba(18,19,23,.96);--toastBg:#26292f;
  --heroA:#20261a;--heroLine:#3a4423;
  --upBg:#23300d;--upTx:#c6f432;--keepBg:#2a2412;--keepTx:#fbbf24;--newBg:#132233;--newTx:#60a5fa;
  --tmBg:#1c2a0c;--tmLine:#4a6418;--tmTx:#c6f432;--tmSub:#cfe3a3;--tmFinBg:#3a2c08;
  --calF:#2b3a10;--calFtx:#c6f432;--calA:#132233;--calAtx:#60a5fa;
  --r:16px;--safeT:env(safe-area-inset-top);--safeB:env(safe-area-inset-bottom);
}
:root[data-theme="light"]{
  --bg:#f3f4f6;--card:#ffffff;--card2:#eef0f3;--line:#dde1e7;
  --tx:#14161a;--mu:#5d6572;--ac:#c6f432;--acInk:#141a05;
  --ok:#10b981;--okBg:#e2f7ee;--okLine:#98dcbf;--warn:#b45309;--bad:#dc2626;--blue:#2563eb;
  --acTx:#4d7c0f;--chart1:#65a30d;--soft:rgba(0,0,0,.06);
  --topBg:rgba(243,244,246,.92);--navBg:rgba(255,255,255,.96);--toastBg:#ffffff;
  --heroA:#eef7d6;--heroLine:#d3e79c;
  --upBg:#edf7d3;--upTx:#3f6212;--keepBg:#fdf2da;--keepTx:#92400e;--newBg:#e1ecfd;--newTx:#1d4ed8;
  --tmBg:#f1f8dd;--tmLine:#b7d56b;--tmTx:#3f6212;--tmSub:#4d5b33;--tmFinBg:#fdf0d4;
  --calF:#e3f2bd;--calFtx:#3f6212;--calA:#dce8fb;--calAtx:#1d4ed8;
}
:root[data-theme="light"] #modal{background:rgba(20,22,26,.35)}
:root[data-theme="light"] #timer,:root[data-theme="light"] #modal .sheet{box-shadow:0 10px 30px rgba(0,0,0,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
body{min-height:100vh;padding-bottom:calc(76px + var(--safeB))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
textarea{resize:vertical;min-height:70px}
#top{position:sticky;top:0;z-index:20;background:var(--topBg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:calc(10px + var(--safeT)) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
#top h1{font-size:20px;margin:0;flex:1;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .r{color:var(--mu);font-size:14px;font-variant-numeric:tabular-nums}
main{max-width:680px;margin:0 auto;padding:14px 16px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.mu{color:var(--mu)} .sm{font-size:13px} .xs{font-size:12px}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:22px 2px 10px;font-weight:600}
h3{margin:0;font-size:18px;letter-spacing:-.01em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:600}
.btn.pri{background:var(--ac);color:var(--acInk);border-color:var(--ac)}
.btn.bad{color:var(--bad)}
.btn.full{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.hero{background:linear-gradient(160deg,var(--heroA),var(--card) 60%);border-color:var(--heroLine)}
.hero .tag{color:var(--acTx);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.hero h3{font-size:24px;margin:4px 0 2px}
.list .it{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;width:100%;text-align:left}
.list .it .d{width:44px;height:44px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--mu);flex:none}
.chev{color:var(--mu);font-size:20px}
/* ejercicio */
.ex{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.ex.okk{border-color:var(--okLine)}
.ex.skip{opacity:.45}
.ex .hd{display:flex;align-items:flex-start;gap:10px}
.ex .n{width:28px;height:28px;border-radius:9px;background:var(--card2);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--mu);flex:none;margin-top:1px}
.ex.okk .n{background:var(--ok);color:#05261a}
.ex .nm{font-size:18px;font-weight:650;line-height:1.25}
.ex .tg{font-size:13px;color:var(--mu);margin-top:2px}
.ubtn{flex:none;min-width:52px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card2);font-weight:700;font-size:14px}
.ubtn b{color:var(--acTx)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card2);font-size:14px}
.chip.on{background:var(--ac);color:var(--acInk);border-color:var(--ac);font-weight:600}
.last{margin-top:10px;font-size:14px;color:var(--mu)}
.last b{color:var(--tx);font-weight:600}
.sug{margin-top:8px;display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:10px;font-size:14px;font-weight:600}
.sug.up{background:var(--upBg);color:var(--upTx)}
.sug.keep{background:var(--keepBg);color:var(--keepTx)}
.sug.new{background:var(--newBg);color:var(--newTx)}
.sug button{margin-left:auto;padding:5px 10px;border-radius:8px;background:var(--soft);font-size:13px;font-weight:700;white-space:nowrap}
.sets{margin-top:12px;display:grid;gap:8px}
.sh{display:grid;grid-template-columns:30px 1fr 1fr 52px;gap:8px;font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;padding:0 2px}
.set{display:grid;grid-template-columns:30px 1fr 1fr 52px;gap:8px;align-items:center}
.sets.rir .sh,.sets.rir .set{grid-template-columns:26px 1fr 1fr 50px 48px;gap:6px}
.set input.rr{font-size:16px;padding:9px 2px}
.exnote{margin-top:6px;font-size:14px;color:var(--tx);background:var(--card2);border-radius:9px;padding:7px 10px;width:100%;text-align:left}
.exnote.vac{color:var(--mu);background:none;padding:4px 0;font-size:13px}
.set .i{font-weight:700;color:var(--mu);text-align:center}
.set input{text-align:center;font-size:19px;font-weight:600;padding:9px 6px;font-variant-numeric:tabular-nums}
.set .wcol{position:relative}
.set .eq{position:absolute;left:0;right:0;bottom:-15px;text-align:center;font-size:11px;color:var(--mu);pointer-events:none}
.set.has-eq{margin-bottom:12px}
.chk{height:46px;border-radius:12px;border:2px solid var(--line);background:var(--card2);font-size:22px;color:var(--mu);display:grid;place-items:center}
.set.dn .chk{background:var(--ok);border-color:var(--ok);color:#05261a}
.set.dn input{background:var(--okBg);border-color:var(--okLine)}
.pr{color:var(--warn);font-size:12px;font-weight:700}
.exf{display:flex;gap:8px;margin-top:12px}
.exf .btn{flex:1}
/* timer */
#timer{position:fixed;left:12px;right:12px;bottom:calc(72px + var(--safeB));z-index:30;max-width:656px;margin:0 auto;background:var(--tmBg);border:1px solid var(--tmLine);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.5);overflow:hidden}
#timer[hidden]{display:none}
#timer .tt{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--tmTx);min-width:72px}
#timer .tl{flex:1;font-size:13px;color:var(--tmSub)}
#timer .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--chart1);transition:width .25s linear}
#timer button{width:44px;height:38px;border-radius:10px;background:var(--soft);font-weight:700;font-size:14px}
#timer.fin{background:var(--tmFinBg);border-color:var(--warn)}
#timer.fin .tt{color:var(--warn)}
/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--navBg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + var(--safeB))}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;color:var(--mu);font-weight:600}
#nav button svg{width:24px;height:24px}
#nav button.on{color:var(--acTx)}
/* modal */
#modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
#modal .sheet{background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:680px;max-height:88vh;overflow:auto;padding:18px 16px calc(18px + var(--safeB))}
@media(min-width:700px){#modal{align-items:center}#modal .sheet{border-radius:20px}}
#toast{position:fixed;left:50%;top:calc(70px + var(--safeT));transform:translateX(-50%) translateY(-20px);opacity:0;z-index:60;background:var(--toastBg);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-weight:600;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* aviso visual de fin de descanso (iPhone no vibra desde la web) */
#flash{position:fixed;inset:0;z-index:55;background:var(--warn);opacity:0;pointer-events:none}
#flash.on{animation:fl 1.5s ease-out}
@keyframes fl{0%,33%,66%{opacity:.55}16%,50%,100%{opacity:0}}
@media(prefers-reduced-motion:reduce){#flash.on{animation:fl2 1.5s}@keyframes fl2{0%{opacity:.4}100%{opacity:0}}}
/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:12px;color:var(--mu);padding:4px 0}
.cal .c{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;background:var(--card2);position:relative}
.cal .c.e{background:none}
.cal .c.t{outline:2px solid var(--chart1)}
.cal .c.f{background:var(--calF);color:var(--calFtx);font-weight:700}
.cal .c.a{background:var(--calA);color:var(--calAtx);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .v{font-size:22px;font-weight:800;letter-spacing:-.02em}
.stat .l{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
canvas{width:100%;height:220px;display:block}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{padding:6px 14px;border-radius:8px;font-weight:700;font-size:14px;color:var(--mu)}
.seg button.on{background:var(--ac);color:var(--acInk)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td{padding:9px 4px;border-top:1px solid var(--line);vertical-align:top}
.tbl td:last-child{text-align:right;white-space:nowrap}
label.f{display:block;font-size:13px;color:var(--mu);margin:10px 0 5px}
.edx{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.edx .g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
.edx input,.edx select{padding:8px 8px;background:var(--card)}
.edx .tools{display:flex;gap:6px;margin-top:8px;justify-content:flex-end}
.empty{text-align:center;color:var(--mu);padding:40px 16px}
.empty .big{font-size:40px;margin-bottom:6px}
.sp{height:8px}
.note{border-color:var(--heroLine);background:var(--heroA)}
.note.warn{border-color:var(--warn);background:var(--keepBg);color:var(--keepTx)}
.note.warn b{color:inherit}
</style>
</head>
<body>
<header id="top"><h1 id="ttl">Mi Gym</h1><span class="r" id="clk"></span></header>
<main id="view"></main>
<div id="timer" hidden>
  <div class="tt" id="tt">0:00</div>
  <div class="tl" id="tl">Descanso</div>
  <button data-act="t-" aria-label="Menos 15 segundos">−15</button>
  <button data-act="t+" aria-label="Más 15 segundos">+15</button>
  <button data-act="tx" aria-label="Cerrar">✕</button>
  <div class="bar" id="tbar"></div>
</div>
<nav id="nav">
  <button data-tab="hoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg><span id="navHoy">Hoy</span></button>
  <button data-tab="historial"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Historial</button>
  <button data-tab="progreso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M5 15l4-4 3 3 6-7"/><path d="M15 7h3v3"/></svg>Progreso</button>
  <button data-tab="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Ajustes</button>
</nav>
<div id="modal" hidden></div>
<div id="toast"></div>
<div id="flash"></div>
<input type="file" id="fileIn" hidden><!-- sin accept: en iOS los .json salen grises con accept -->

<script>
'use strict';
/* ================= Mi Gym v1.3 — registro de entrenamiento offline ================= */
const APP_VER='1.3';
const KEY='migym.v1';
const LB=0.45359237;
const DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const DC=['dom','lun','mar','mié','jue','vie','sáb'];
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const M3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');

/* ---------- Rutina base (la del usuario) ---------- */
function E(txt,sets,min,max,group,mode){
  const p=txt.split('|').map(x=>x.trim()).filter(Boolean);
  return {label:p.length>1?p.join(' o '):p[0],options:p.length>1?p:[],sets,min,max,group:group||'sup',mode:mode||'reps'};
}
function defaults(){
  const T=[
    {id:'t-lun',name:'Pierna A',sub:'Cuádriceps + fuerza',weekday:1,cardio:'15–20 min caminata con inclinación',ex:[
      E('Sentadilla con barra',4,6,8,'inf'),E('Prensa de pierna',3,8,10,'inf'),E('Peso muerto rumano',3,8,10,'inf'),
      E('Extensión de cuádriceps',3,12,15,'inf'),E('Curl femoral',3,10,12,'inf'),E('Pantorrilla de pie | Pantorrilla sentado',3,12,15,'inf')]},
    {id:'t-mar',name:'Pecho + Tríceps',sub:'+ hombro ligero',weekday:2,cardio:'15–20 min',ex:[
      E('Press de banca',4,6,8),E('Press inclinado con mancuernas',3,8,10),E('Aperturas con mancuernas | Aperturas en máquina',3,10,15),
      E('Fondos | Press cerrado',3,8,10),E('Tríceps en polea',3,10,12),E('Elevaciones laterales',3,12,15)]},
    {id:'t-mie',name:'Espalda + Bíceps',sub:'+ core ligero',weekday:3,cardio:'15 min',ex:[
      E('Jalón al pecho',4,8,10),E('Remo con barra',3,8,10),E('Remo en máquina',3,10,12),E('Face pull',3,12,15),
      E('Curl de bíceps con barra',3,8,10),E('Curl martillo',3,10,12),E('Crunch en polea | Crunch en máquina',2,12,15)]},
    {id:'t-jue',name:'Descanso activo',sub:'Recuperar sin generar fatiga',weekday:4,type:'descanso',acts:[
      {n:'Caminata',r:'30–45 min'},{n:'Bicicleta suave',r:'25–35 min'},{n:'Movilidad y estiramientos',r:'15–20 min'}]},
    {id:'t-vie',name:'Pierna B + Torso + Brazos',sub:'Glúteo / femoral',weekday:5,cardio:'10–15 min',ex:[
      E('Peso muerto convencional',4,5,8,'inf'),E('Hip thrust',4,8,10,'inf'),E('Prensa inclinada',3,10,12,'inf'),
      E('Curl femoral',3,10,12,'inf'),E('Abducción de cadera',3,12,15,'inf'),E('Pantorrilla de pie | Pantorrilla sentado',3,12,15,'inf'),
      E('Press en máquina | Flexiones',2,10,15),E('Remo en máquina | Remo en cable',2,10,15),
      E('Curl de bíceps en cable | Curl de bíceps con mancuernas',2,10,12),E('Extensión de tríceps en polea',2,10,12)]},
    {id:'t-sab',name:'Hombro + Core',sub:'',weekday:6,cardio:'20 min',ex:[
      E('Press militar',4,6,8),E('Elevaciones laterales',3,12,15),E('Pájaros (deltoide posterior)',3,12,15),
      E('Encogimientos para trapecio',3,10,12),E('Plancha',3,40,60,'core','tiempo'),E('Crunch en polea | Crunch en máquina',3,10,15)]},
  ];
  T.forEach(t=>{t.type=t.type||'fuerza';t.sub=t.sub||'';t.cardio=t.cardio||'';t.acts=t.acts||[];
    t.ex=(t.ex||[]).map((e,i)=>({id:t.id+'-'+(i+1),...e}));t.upd=0;});
  return T;
}

/* ---------- Estado y guardado ---------- */
function fresh(){return {v:1,templates:defaults(),sessions:[],activeId:null,units:{},choice:{},
  body:[],exNotes:{},lastBackup:null,
  settings:{defUnit:'kg',restHeavy:150,restLight:90,sound:true,loud:false,rir:false,theme:'auto'}}}
function load(){
  let d=null;try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!d||!Array.isArray(d.templates))return fresh();
  const f=fresh();
  // quita sesiones sin terminar que ya no están en curso (quedarían ocultas para siempre)
  const sessions=(Array.isArray(d.sessions)?d.sessions:[]).filter(s=>s.end||s.id===d.activeId);
  const activeId=sessions.some(s=>s.id===d.activeId)?d.activeId:null;
  return {...f,...d,sessions,activeId,settings:{...f.settings,...(d.settings||{})}};
}
let S=load();
const UI={tab:'hoy',month:null,prog:null,progU:null,edit:null};
let saveT;
function save(now){clearTimeout(saveT);const w=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('⚠️ No se pudo guardar')}};now?w():saveT=setTimeout(w,250)}
addEventListener('pagehide',()=>save(true));
document.addEventListener('visibilitychange',()=>{if(document.hidden)save(true);else{lockWake();
  // iOS congela la app en segundo plano: avisa si el descanso terminó mientras no la veías
  if(T.end&&!T.done&&Date.now()>T.end){const s=Math.round((Date.now()-T.end)/1000);T.done=true;flash();toast('⏱ Tu descanso terminó hace '+(s<60?s+' s':Math.floor(s/60)+' min '+pad(s%60)+' s'))}
  tick()}});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ---------- Dispositivo ---------- */
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const STANDALONE=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;

/* ---------- Fechas ---------- */
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const pD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fShort=s=>{const d=pD(s);return DC[d.getDay()]+' '+d.getDate()+' '+M3[d.getMonth()]};
const fLong=s=>{const d=pD(s);return DIAS[d.getDay()]+' '+d.getDate()+' de '+MES[d.getMonth()]};
const daysAgo=s=>Math.round((pD(today())-pD(s))/864e5);
const agoTxt=s=>{const n=daysAgo(s);return n===0?'hoy':n===1?'ayer':'hace '+n+' días'};
function dur(ms){const m=Math.max(0,Math.round(ms/60000));return m<60?m+' min':Math.floor(m/60)+' h '+pad(m%60)}

/* ---------- Pesos ---------- */
const num=x=>(x===''||x==null)?NaN:parseFloat(String(x).replace(',','.'));
const toKg=(v,u)=>u==='lb'?v*LB:v;
const fromKg=(k,u)=>u==='lb'?k/LB:k;
const ou=u=>u==='kg'?'lb':'kg';
const fw=v=>{const r=Math.round(v*10)/10;return Number.isInteger(r)?String(r):r.toFixed(1)};
const stepR=(x,u)=>u==='kg'?Math.round(x*4)/4:Math.round(x*2)/2;
function eqTxt(v,u){const n=num(v);return n>0?'≈ '+fw(fromKg(toKg(n,u),ou(u)))+' '+ou(u):''}

/* ---------- Consultas de historial ---------- */
const doneSessions=()=>S.sessions.filter(s=>s.end).sort((a,b)=>a.start-b.start);
const keyOf=it=>it.chosen||it.label;
const dSets=it=>(it.sets||[]).filter(x=>x.d);
const active=()=>S.sessions.find(s=>s.id===S.activeId)||null;
const tplById=id=>S.templates.find(t=>t.id===id);
const wkOrd=t=>t.weekday==null?7:(t.weekday+6)%7; // lunes primero, sin día al final
const byWk=(a,b)=>wkOrd(a)-wkOrd(b);
function lastFor(key,exclude){
  const L=doneSessions();
  for(let i=L.length-1;i>=0;i--){const s=L[i];if(s.id===exclude)continue;
    for(const it of s.items||[])if(!it.skipped&&keyOf(it)===key&&dSets(it).length)return{s,it};}
  return null;
}
function bestFor(key,exclude){
  let b=null;
  for(const s of doneSessions()){if(s.id===exclude)continue;
    for(const it of s.items||[]){if(keyOf(it)!==key||it.mode==='tiempo')continue;
      for(const x of dSets(it)){const k=toKg(num(x.v)||0,x.u||it.u);if(k>0&&(!b||k>b.kg))b={kg:k,date:s.date};}}}
  return b;
}

/* ---------- Sesiones ---------- */
function makeItem(e){
  let ch=null;if(e.options&&e.options.length){ch=S.choice[e.id];if(!e.options.includes(ch))ch=e.options[0];}
  const it={eid:e.id,label:e.label,options:[...(e.options||[])],chosen:ch,target:e.sets,min:e.min,max:e.max,
    mode:e.mode||'reps',group:e.group||'sup',rest:e.rest||'',skipped:false,u:'kg',sets:[]};
  fillSets(it);return it;
}
function fillSets(it){
  const key=keyOf(it);it.u=S.units[key]||S.settings.defUnit;
  const last=lastFor(key,S.activeId);const ls=last?dSets(last.it):[];
  const keep=it.sets.filter(x=>x.d);keep.forEach(x=>convSet(x,it.u));
  const out=[...keep];
  for(let i=keep.length;i<Math.max(it.target,keep.length);i++){
    const p=ls[i]||ls[ls.length-1];let v='';
    if(p&&num(p.v)>0)v=fw(fromKg(toKg(num(p.v),p.u||last.it.u),it.u));
    out.push({v,r:'',s:'',rir:'',d:false,u:it.u,ph:p?String(it.mode==='tiempo'?(p.s||''):(p.r||'')):''});
  }
  it.sets=out;
}
function convSet(x,u){if(x.u===u)return;const n=num(x.v);if(n>0)x.v=fw(fromKg(toKg(n,x.u),u));x.u=u}
function startSession(tid){
  const t=tplById(tid);if(!t)return;
  const s={id:uid(),date:today(),start:Date.now(),end:null,tplId:t.id,tplName:t.name,type:t.type,cardioHint:t.cardio||'',
    acts:t.acts||[],items:[],cardio:{tipo:'',min:''},act:{n:'',min:''},watch:{kcal:'',hr:'',hrmax:''},notes:''};
  S.sessions.push(s);S.activeId=s.id;
  s.items=(t.ex||[]).map(makeItem);
  save(true);UI.tab='hoy';render();scrollTo(0,0);lockWake();
}
function suggest(it,last){
  if(!last)return{c:'new',t:it.mode==='tiempo'?`Primera vez: aguanta ${it.min}–${it.max} s`:`Primera vez: usa un peso con el que llegues a ${it.min}–${it.max} reps`};
  const ds=dSets(last.it);
  if(it.mode==='tiempo'){const ok=ds.length>=it.target&&ds.every(x=>num(x.s)>=it.max);
    return ok?{c:'up',t:`⬆ Llegaste a ${it.max} s: sube a ${it.max+10} s o agrega peso`}:{c:'keep',t:`= Busca ${it.max} s en todas las series`};}
  const lu=last.it.u;const mk=Math.max(0,...ds.map(x=>toKg(num(x.v)||0,x.u||lu)));
  const ok=ds.length>=it.target&&ds.every(x=>num(x.r)>=it.max);
  if(mk<=0)return ok?{c:'up',t:`⬆ Llegaste a ${it.max} reps: agrega peso o reps`}:{c:'keep',t:`= Busca ${it.max} reps en todas las series`};
  const cur=fromKg(mk,it.u);
  // RIR (reps en reserva): solo cuenta si se anotó en todas las series
  const rirs=ds.map(x=>num(x.rir)),easy=rirs.length&&rirs.every(n=>n>=3);
  if(ok){let inc=it.group==='inf'?(it.u==='kg'?5:10):(it.u==='kg'?2.5:5);if(easy)inc*=2;const nw=stepR(cur+inc,it.u);
    return{c:'up',t:easy?`⬆ Te sobraban reps (RIR ≥ 3): sube ${fw(cur)} → ${fw(nw)} ${it.u}`:`⬆ Sube peso: ${fw(cur)} → ${fw(nw)} ${it.u}`,nw};}
  if(easy)return{c:'keep',t:`= Te sobraron reps (RIR ≥ 3): con ${fw(cur)} ${it.u} empuja hasta ${it.max} reps`};
  return{c:'keep',t:`= Mantén ${fw(cur)} ${it.u} y busca ${it.max} reps en todas`};
}
function lastLine(it,last){
  if(!last)return'';const ds=dSets(last.it);
  let txt;
  if(it.mode==='tiempo')txt=ds.map(x=>(x.s||'?')+' s').join(' · ');
  else{
    const ws=ds.map(x=>{const n=num(x.v);return n>0?fw(fromKg(toKg(n,x.u||last.it.u),it.u)):'0'});
    const same=ws.every(w=>w===ws[0]);
    txt=same?(ws[0]!=='0'?ws[0]+' '+it.u+' × ':'')+ds.map(x=>x.r||'?').join(' · ')
            :ds.map((x,i)=>ws[i]+'×'+(x.r||'?')).join(' · ')+' '+it.u;
    if(ds.some(x=>x.rir!==''&&x.rir!=null))txt+=' (RIR '+ds.map(x=>x.rir===''||x.rir==null?'?':x.rir).join('·')+')';
  }
  return `Última · ${fShort(last.s.date)}: <b>${esc(txt)}</b>`;
}

/* ---------- Render ---------- */
function setTitle(t,r){$('#ttl').textContent=t;$('#clk').textContent=r||''}
function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===UI.tab));
  $('#navHoy').textContent=S.activeId?'Entreno':'Hoy';
  const v=$('#view');
  if(UI.tab==='hoy')v.innerHTML=S.activeId?vSession():vHoy();
  else if(UI.tab==='historial')v.innerHTML=vHist();
  else if(UI.tab==='progreso'){v.innerHTML=vProg();drawChart();}
  else v.innerHTML=UI.edit?vEdit():vAjustes();
  updClock();
}
function vHoy(){
  setTitle('Mi Gym');
  const td=today(),wd=new Date().getDay();
  const t=S.templates.find(x=>x.weekday===wd);
  const lastOf=id=>{const L=doneSessions().filter(s=>s.tplId===id);return L.length?L[L.length-1]:null};
  let h=`<div class="mu sm" style="margin:2px 2px 10px">${esc(fLong(td))}</div>`;
  if(IOS&&!STANDALONE&&location.protocol.startsWith('http'))
    h+=`<div class="card note warn"><b>📲 Instálala antes de registrar</b><div class="sm" style="margin-top:4px">Toca <b>Compartir</b> → <b>Agregar a inicio</b> y ábrela desde ese ícono. En iPhone, Safari y la app instalada guardan datos por separado: lo que registres aquí no aparecerá en la app.</div></div>`;
  h+=backupNag();
  if(t){const l=lastOf(t.id);
    h+=`<div class="card hero"><div class="tag">Hoy toca</div><h3>${esc(t.name)}</h3>
      <div class="mu sm">${esc(t.sub||'')}${t.type==='fuerza'?(t.sub?' · ':'')+t.ex.length+' ejercicios':''}${l?' · última vez '+agoTxt(l.date):''}</div>
      <div class="sp"></div><button class="btn pri full" data-act="start" data-id="${t.id}">Empezar</button></div>`;
  }else{
    h+=`<div class="card hero"><div class="tag">Hoy</div><h3>${wd===0?'Descanso total':'Sin rutina asignada'}</h3>
      <div class="mu sm">${wd===0?'Recuperación completa. Si quieres entrenar, elige una rutina abajo.':'Elige una rutina abajo.'}</div></div>`;
  }
  h+=`<h2>${t?'¿Otra rutina?':'Rutinas'}</h2><div class="list">`;
  S.templates.filter(x=>x!==t).sort(byWk).forEach(x=>{const l=lastOf(x.id);
    h+=`<button class="it" data-act="start" data-id="${x.id}"><div class="d">${x.weekday!=null?DC[x.weekday]:'—'}</div>
      <div class="grow"><div style="font-weight:600">${esc(x.name)}</div><div class="mu sm">${x.type==='fuerza'?x.ex.length+' ejercicios':'Descanso activo'}${l?' · '+agoTxt(l.date):''}</div></div><span class="chev">›</span></button>`;});
  h+='</div>'+bodyCard();
  const wk=doneSessions().filter(s=>{const n=daysAgo(s.date);const dow=(new Date().getDay()+6)%7;return n<=dow&&s.type==='fuerza'}).length;
  h+=`<div class="mu sm" style="text-align:center;margin-top:14px">Esta semana: <b style="color:var(--tx)">${wk}</b> entrenamiento${wk===1?'':'s'} de fuerza</div>`;
  return h;
}
function backupNag(){
  const L=doneSessions();if(!L.length)return'';
  const lb=S.lastBackup||0,nuevas=L.filter(s=>s.end>lb).length;
  const dias=lb?Math.floor((Date.now()-lb)/864e5):null;
  if(!nuevas||(lb&&dias<7&&nuevas<5))return'';
  return `<div class="card note"><div class="row"><div class="grow sm"><b>💾 ${lb?'Último respaldo hace '+dias+' día'+(dias===1?'':'s'):'Aún no tienes respaldo'}</b>
    <div class="mu xs" style="margin-top:2px">${nuevas} sesion${nuevas===1?'':'es'} sin respaldar. Si borras la app o el iPhone libera espacio, se pierden.</div></div>
    <button class="btn sm pri" data-act="export">Exportar</button></div></div>`;
}
function vSession(){
  const s=active();if(!s){S.activeId=null;return vHoy()}
  setTitle(s.tplName,'');s.watch=s.watch||{kcal:'',hr:'',hrmax:''};
  let h='';
  if(IOS&&!S.lockTipSeen)h+=`<div class="card note"><div class="row"><div class="grow sm">🔆 <b>Deja la pantalla encendida.</b> Si bloqueas el iPhone o cambias de app, el aviso de descanso no suena hasta que vuelvas.</div>
    <button class="btn sm" data-act="locktip">Entendido</button></div></div>`;
  if(s.type==='descanso'){
    h+=`<div class="card"><div class="mu sm">Elige lo que hiciste</div><div class="chips">`+
      s.acts.map(a=>`<button class="chip ${s.act.n===a.n?'on':''}" data-act="act" data-n="${esc(a.n)}">${esc(a.n)} · ${esc(a.r)}</button>`).join('')+
      `</div><label class="f">Minutos</label><input inputmode="numeric" data-c="act.min" value="${esc(s.act.min)}" placeholder="0"></div>`;
  }else{
    s.items.forEach((it,i)=>{h+=vItem(s,it,i)});
    h+=`<button class="btn full" data-act="addex">＋ Agregar ejercicio extra</button>`;
    h+=`<h2>Cardio</h2><div class="card"><div class="mu sm">Plan: ${esc(s.cardioHint||'—')}</div>
      <div class="row" style="margin-top:8px"><input class="grow" data-c="cardio.tipo" value="${esc(s.cardio.tipo)}" placeholder="Tipo (caminadora, bici…)">
      <input style="width:96px" inputmode="numeric" data-c="cardio.min" value="${esc(s.cardio.min)}" placeholder="min"></div></div>`;
  }
  h+=`<h2>⌚ Datos del reloj <span style="text-transform:none;letter-spacing:0;font-weight:400">(opcional)</span></h2><div class="card">${watchInputs(s.watch,'data-c="watch.')}
    <div class="mu xs" style="margin-top:8px">Cópialos del resumen del entrenamiento en tu Apple Watch o en la app Fitness. También puedes llenarlos después desde el Historial.</div></div>`;
  h+=`<h2>Notas</h2><textarea data-c="notes" placeholder="¿Cómo te sentiste? molestias, energía…">${esc(s.notes)}</textarea>
    <div class="sp"></div><div class="sp"></div>
    <button class="btn pri full" data-act="finish">Terminar entrenamiento</button><div class="sp"></div>
    <button class="btn full bad" data-act="discard">Descartar sesión</button>`;
  return h;
}
function vItem(s,it,i){
  const key=keyOf(it),last=lastFor(key,s.id);
  const all=it.sets.length&&it.sets.every(x=>x.d);
  const tm=it.mode==='tiempo',rir=S.settings.rir&&!tm,note=S.exNotes[key];
  let h=`<div class="ex ${all?'okk':''} ${it.skipped?'skip':''}" id="ex${i}"><div class="hd"><div class="n">${all?'✓':i+1}</div>
    <div class="grow"><div class="nm">${esc(key)}</div><div class="tg">${it.target} × ${it.min}–${it.max}${tm?' s':' reps'}${it.rest?' · descanso '+it.rest+' s':''}${it.extra?' · extra':''}</div></div>
    ${tm?'':`<button class="ubtn" data-act="unit" data-i="${i}" title="Cambiar unidad"><b>${it.u}</b></button>`}</div>`;
  if(it.skipped)return h+`<div class="exf"><button class="btn sm" data-act="skip" data-i="${i}">Volver a incluir</button></div></div>`;
  h+=`<button class="exnote ${note?'':'vac'}" data-act="note" data-i="${i}">${note?'📝 '+esc(note):'＋ Nota del ejercicio (asiento, agarre…)'}</button>`;
  if(it.options.length>1)h+=`<div class="chips">`+it.options.map((o,k)=>`<button class="chip ${o===it.chosen?'on':''}" data-act="opt" data-i="${i}" data-k="${k}">${esc(o)}</button>`).join('')+`</div>`;
  if(last)h+=`<div class="last">${lastLine(it,last)}</div>`;
  const sg=suggest(it,last);
  h+=`<div class="sug ${sg.c}"><span>${esc(sg.t)}</span>${sg.nw?`<button data-act="apply" data-i="${i}" data-w="${sg.nw}">Aplicar</button>`:''}</div>`;
  h+=`<div class="sets ${rir?'rir':''}"><div class="sh"><span style="text-align:center">#</span><span style="text-align:center">${tm?'Peso (opc.)':'Peso '+it.u}</span><span style="text-align:center">${tm?'Segundos':'Reps'}</span>${rir?'<span style="text-align:center">RIR</span>':''}<span></span></div>`;
  it.sets.forEach((x,j)=>{const eq=tm?'':eqTxt(x.v,it.u);
    h+=`<div class="set ${x.d?'dn':''} ${eq?'has-eq':''}"><div class="i">${j+1}${x.pr?'<div class="pr">PR</div>':''}</div>

    <div class="grow"><label class="f">Tipo</label><select data-tf="type"><option value="fuerza" ${t.type==='fuerza'?'selected':''}>Fuerza</option><option value="descanso" ${t.type==='descanso'?'selected':''}>Descanso activo</option></select></div></div>`;

  }else{
    h+=`<h2>Ejercicios</h2><div class="mu xs" style="margin:-4px 2px 8px">Para variantes escribe con barra: <b style="color:var(--tx)">Fondos | Press cerrado</b>. Descanso vacío (Auto) usa el de Ajustes.</div>`;
    t.ex.forEach((e,i)=>{h+=`<div class="edx"><input data-ef="text" data-e="${i}" value="${esc(e.options.length?e.options.join(' | '):e.label)}" placeholder="Nombre del ejercicio">

      <div><div class="mu xs">${e.mode==='tiempo'?'Seg. mín':'Reps mín'}</div><input inputmode="numeric" data-ef="min" data-e="${i}" value="${e.min}"></div>
      <div><div class="mu xs">${e.mode==='tiempo'?'Seg. máx':'Reps máx'}</div><input inputmode="numeric" data-ef="max" data-e="${i}" value="${e.max}"></div></div>
      <div class="g"><div><div class="mu xs">Descanso (s)</div><input inputmode="numeric" data-ef="rest" data-e="${i}" value="${e.rest||''}" placeholder="Auto"></div>
      <div><div class="mu xs">Tipo</div><select data-ef="mode" data-e="${i}"><option value="reps" ${e.mode!=='tiempo'?'selected':''}>Reps</option><option value="tiempo" ${e.mode==='tiempo'?'selected':''}>Tiempo</option></select></div>
      <div><div class="mu xs">Grupo</div><select data-ef="group" data-e="${i}"><option value="sup" ${e.group==='sup'?'selected':''}>Superior</option><option value="inf" ${e.group==='inf'?'selected':''}>Pierna</option><option value="core" ${e.group==='core'?'selected':''}>Core</option></select></div></div>
      <div class="tools"><button class="btn sm" data-act="emv" data-e="${i}" data-d="-1">↑</button><button class="btn sm" data-act="emv" data-e="${i}" data-d="1">↓</button><button class="btn sm bad" data-act="edel" data-e="${i}">Quitar</button></div></div>`});
    h+=`<button class="btn full" data-act="eadd">＋ Agregar ejercicio</button>`;
  }
  h+=`<div class="sp"></div><div class="sp"></div><button class="btn full bad" data-act="tdel">Eliminar esta rutina</button>
    <div class="sp"></div><button class="btn full" data-act="treset">Restaurar rutinas originales</button>
    <div class="mu xs" style="margin-top:8px">Los cambios se guardan solos y aplican a partir del siguiente entrenamiento.</div>`;
  return h;
}

/* ---------- UI helpers ---------- */
function modal(html){const m=$('#modal');m.innerHTML=`<div class="sheet">${html}</div>`;m.hidden=false}
function closeModal(){const m=$('#modal'),was=!m.hidden;m.hidden=true;m.innerHTML='';if(was&&UI.tab==='historial')render()}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
let toastT;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2400)}
function updClock(){const s=active();if(s&&UI.tab==='hoy')$('#clk').textContent='⏱ '+dur(Date.now()-s.start)}

/* ---------- Temporizador de descanso ---------- */
const TKEY='migym.timer';
const T={end:0,total:0,done:false};let AC=null;
// el descanso sobrevive si iOS recarga la app en segundo plano
function saveTimer(){try{T.end?localStorage.setItem(TKEY,JSON.stringify({end:T.end,total:T.total})):localStorage.removeItem(TKEY)}catch(e){}}
try{const t=JSON.parse(localStorage.getItem(TKEY));if(t&&t.end&&S.activeId&&Date.now()<t.end+6000){T.end=t.end;T.total=t.total||0;T.done=Date.now()>=t.end}}catch(e){}
function unlockAudio(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
// iOS: con audioSession 'playback' suena aunque el interruptor de silencio esté activado,
// pero pausa la música de otras apps; por eso es opcional y se regresa a 'auto' al terminar
function loudOn(){try{if(S.settings.loud&&navigator.audioSession){navigator.audioSession.type='playback';setTimeout(()=>{try{navigator.audioSession.type='auto'}catch(e){}},1200)}}catch(e){}}
function flash(){const f=$('#flash');f.classList.remove('on');void f.offsetWidth;f.classList.add('on')}
function beep(){flash();if(!S.settings.sound||!AC)return;loudOn();try{if(AC.state==='suspended')AC.resume();[0,.25,.5].forEach(t=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;o.connect(g);g.connect(AC.destination);
  g.gain.setValueAtTime(.0001,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(.4,AC.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+t+.18);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+.2)})}catch(e){}}
function startRest(sec){T.total=sec;T.end=Date.now()+sec*1000;T.done=false;saveTimer();tick()}
function tick(){
  const el=$('#timer');if(!T.end){el.hidden=true;return}
  const left=Math.ceil((T.end-Date.now())/1000);
  if(left<=0&&!T.done){T.done=true;beep();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
  if(left<=-6){T.end=0;saveTimer();el.hidden=true;return}
  el.hidden=false;el.classList.toggle('fin',left<=0);
  const a=Math.max(0,left);$('#tt').textContent=Math.floor(a/60)+':'+pad(a%60);
  $('#tl').textContent=left<=0?'¡Listo! Siguiente serie':'Descanso';
  $('#tbar').style.width=(T.total?Math.max(0,Math.min(1,a/T.total))*100:0)+'%';
}
setInterval(()=>{tick();updClock()},250);

async function lockWake(){if(!S.activeId||document.hidden||WL)return;try{WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null})}catch(e){}}
function unlockWake(){try{WL&&WL.release()}catch(e){}WL=null}

    case 'addset':{const l=it.sets[it.sets.length-1];it.sets.push({v:l?l.v:'',r:'',s:'',rir:'',d:false,u:it.u,ph:l?(l.r||l.ph||''):''});save();render();break}
    case 'delset':{if(it.sets.length<=1)return;const k=it.sets.map(x=>x.d).lastIndexOf(false);it.sets.splice(k>=0?k:it.sets.length-1,1);save();render();break}

      <label class="f">Grupo</label><select id="ng"><option value="sup">Tren superior</option><option value="inf">Pierna</option><option value="core">Core</option></select>

      setTimeout(()=>{const n=$('#nx');n&&n.focus()},50);break;
    case 'addexok':{const n=$('#nx').value.trim();if(!n){toast('Escribe el nombre');return}

document.addEventListener('input',e=>{

document.addEventListener('change',e=>{

    else if(f==='type'){t.type=el.value;touch(t);render();return}

    touch(t);return}
  if(el.dataset.ef){const x=t.ex[+el.dataset.e],f=el.dataset.ef;

    else if(f==='rest'){const n=parseInt(el.value);x.rest=n>0?Math.min(n,900):''}
    else x[f]=Math.max(1,parseInt(el.value)||1);
    touch(t);}
});

/* ---------- Terminar ---------- */
function finish(){
  const s=active();if(!s)return;
  const n=(s.items||[]).reduce((a,it)=>a+dSets(it).length,0);
  if(s.type==='fuerza'&&n===0&&!confirm('No marcaste ninguna serie. ¿Terminar de todos modos?'))return;
  if(s.type==='descanso'&&!s.act.n&&s.acts.length){toast('Elige qué actividad hiciste');return}
  s.end=Date.now();
  s.items.forEach(it=>it.sets.forEach(x=>{x.u=it.u}));
  let vol=0,prs=[];s.items.forEach(it=>dSets(it).forEach(x=>{vol+=toKg(num(x.v)||0,x.u)*(num(x.r)||0);if(x.pr&&!prs.includes(keyOf(it)))prs.push(keyOf(it))}));
  S.activeId=null;T.end=0;saveTimer();tick();unlockWake();save(true);UI.tab='hoy';render();scrollTo(0,0);
  modal(`<div style="text-align:center"><div style="font-size:46px">💪</div><h3 style="font-size:22px">¡Entrenamiento terminado!</h3><div class="mu">${esc(s.tplName)}</div></div><div class="sp"></div>
    <div class="stats"><div class="stat"><div class="l">Duración</div><div class="v">${dur(s.end-s.start)}</div></div>
    <div class="stat"><div class="l">${s.type==='fuerza'?'Series':'Minutos'}</div><div class="v">${s.type==='fuerza'?n:esc(s.act.min||'—')}</div></div>
    ${vol>0?`<div class="stat" style="grid-column:span 2"><div class="l">Volumen total</div><div class="v">${Math.round(vol).toLocaleString('es-MX')} kg</div><div class="mu xs">${Math.round(vol/LB).toLocaleString('es-MX')} lb</div></div>`:''}</div>
    ${watchTxt(s.watch)?`<div class="card" style="margin-top:12px">⌚ ${esc(watchTxt(s.watch))}</div>`:''}
    ${prs.length?`<div class="card" style="margin-top:12px;border-color:var(--warn)"><b style="color:var(--warn)">🏆 Récords:</b> ${prs.map(esc).join(', ')}</div>`:''}
    <div class="sp"></div><button class="btn pri full" data-act="close">Listo</button>`);
}

/* ---------- Respaldo ---------- */
async function exportData(){
  const data=JSON.stringify({app:'migym',ver:APP_VER,exported:new Date().toISOString(),data:S});
  const name='migym-respaldo-'+today()+'.json';
  const done=()=>{S.lastBackup=Date.now();save(true);render()};
  try{
    if(IOS&&navigator.canShare){const f=new File([data],name,{type:'application/json'});
      if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Respaldo Mi Gym'});done();toast('Respaldo guardado');return}}
  }catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);done();toast('Respaldo exportado');
}
const sVer=s=>Math.max(s.upd||0,s.end||0); // última modificación de una sesión terminada
$('#fileIn').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  let d;try{d=JSON.parse(await f.text());d=d.data||d;if(!Array.isArray(d.templates)||!Array.isArray(d.sessions))throw 0}catch(err){toast('⚠️ Ese archivo no es un respaldo válido');return}
  if(UI.importMode==='replace'){
    if(!confirm('Esto reemplaza TODOS los datos de este dispositivo por los del respaldo. ¿Continuar?'))return;
    const f2=fresh();S={...f2,...d,settings:{...f2.settings,...(d.settings||{})},sessions:d.sessions.filter(x=>x.end),activeId:null,lastBackup:Date.now()};save(true);render();toast('Datos reemplazados');return}
  let added=0,upd=0;
  d.sessions.filter(x=>x.end).forEach(x=>{const k=S.sessions.findIndex(y=>y.id===x.id);if(k<0){S.sessions.push(x);added++}else if(S.sessions[k].end&&sVer(x)>sVer(S.sessions[k])){S.sessions[k]=x;upd++}});
  d.templates.forEach(t=>{const k=S.templates.findIndex(y=>y.id===t.id);if(k<0)S.templates.push(t);else if((t.upd||0)>(S.templates[k].upd||0))S.templates[k]=t});
  S.units={...(d.units||{}),...S.units};S.choice={...(d.choice||{}),...S.choice};S.exNotes={...(d.exNotes||{}),...S.exNotes};
  (Array.isArray(d.body)?d.body:[]).forEach(b=>{const k=S.body.findIndex(y=>y.date===b.date);if(k<0)S.body.push(b);else if((b.t||0)>(S.body[k].t||0))S.body[k]=b});
  S.body.sort((a,b)=>a.date<b.date?-1:1);
  save(true);render();toast(`Combinado: ${added} sesiones nuevas${upd?', '+upd+' actualizadas':''}`);
});

/* ---------- Tema ---------- */
const mqDark=matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){const t=S.settings.theme||'auto',d=t==='auto'?mqDark.matches:t==='dark';
  document.documentElement.dataset.theme=d?'dark':'light';$('#metaTheme').setAttribute('content',d?'#0e0f12':'#f3f4f6');}
try{mqDark.addEventListener('change',()=>{if((S.settings.theme||'auto')==='auto'){applyTheme();render()}})}catch(e){}

/* ---------- Arranque ---------- */
applyTheme();render();lockWake();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
